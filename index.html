<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#050d1a" />
  <meta name="description" content="The Shazam of Karaoke — AI-powered synchronized lyrics." />
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />
  <title>Singova – AI Karaoke</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
    rel="stylesheet" />

  <!-- Custom styles (mobile-first, no Tailwind dependency for layout) -->
  <link rel="stylesheet" href="style.css" />

  <!-- Tailwind for utility classes (color, spacing helpers only) -->
  <script src="https://cdn.tailwindcss.com"></script>

  <style>
    /* Structural layout — defined here so it loads before Tailwind and can't be overridden */
    body {
      display: flex;
      background: #050d1a;
      color: #ffffff;
    }

    #sidebar {
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
    }

    main {
      flex: 1 1 0;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      min-width: 0;
    }
  </style>
</head>

<body>

  <!-- ═══ SIDEBAR ════════════════════════════════════════════════════════════ -->
  <aside id="sidebar" class="glass">

    <!-- Brand row + mobile toggle -->
    <div style="display:flex;align-items:center;justify-content:space-between;padding:1rem 1.25rem;border-bottom:1px solid rgba(255,255,255,.05);">
      <h1 class="gradient-text" style="font-size:1.125rem;font-weight:700;">🎤 Singova</h1>

      <!-- ☰ button — mobile only, hidden via CSS on desktop -->
      <button id="btn-library-toggle"
        style="background:none;border:none;cursor:pointer;color:#94a3b8;padding:0.25rem;border-radius:0.5rem;line-height:1;"
        aria-label="Toggle library" aria-expanded="false">
        <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" fill="none" viewBox="0 0 24 24"
          stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="3" y1="6"  x2="21" y2="6"/>
          <line x1="3" y1="12" x2="21" y2="12"/>
          <line x1="3" y1="18" x2="21" y2="18"/>
        </svg>
      </button>
    </div>

    <!-- Collapsible body -->
    <div id="sidebar-body" style="display:flex;flex-direction:column;flex:1;overflow:hidden;">


      <!-- Library -->
      <div style="flex:1;overflow-y:auto;padding:1rem;">
        <h2 style="font-size:0.6875rem;color:#64748b;text-transform:uppercase;letter-spacing:.08em;margin-bottom:0.75rem;">
          Library
        </h2>
        <ul id="library-list" style="display:flex;flex-direction:column;gap:0.25rem;font-size:0.875rem;list-style:none;"></ul>
      </div>

      <!-- PWA install -->
      <div style="padding:1rem;border-top:1px solid rgba(255,255,255,.05);">
        <button id="btn-install"
          style="display:none;width:100%;font-size:0.75rem;padding:0.5rem;border-radius:0.5rem;background:rgba(0,100,160,.4);border:1px solid rgba(0,180,216,.3);color:#7dd3fc;cursor:pointer;transition:background .2s;">
          ⬇ Install App
        </button>
      </div>
    </div>
  </aside>

  <!-- ═══ MAIN ════════════════════════════════════════════════════════════════ -->
  <main>

    <!-- Now-playing strip -->
    <div id="np-strip"
      style="display:none;padding:0.625rem 1.25rem;border-bottom:1px solid rgba(255,255,255,.05);flex-shrink:0;"
      class="glass">
      <div style="display:flex;align-items:center;gap:0.75rem;min-width:0;">
        <div
          style="width:2.25rem;height:2.25rem;border-radius:0.5rem;background:linear-gradient(135deg,#0096c7,#00b4d8);display:flex;align-items:center;justify-content:center;font-size:1rem;flex-shrink:0;">
          🎵
        </div>
        <div style="flex:1;min-width:0;">
          <p id="np-title"
            style="font-size:0.8125rem;font-weight:600;color:#fff;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%;"></p>
          <p id="np-sub" style="font-size:0.6875rem;color:#64748b;"></p>
        </div>
        <!-- Waveform -->
        <div id="waveform" style="display:none;align-items:center;gap:2px;height:1.5rem;flex-shrink:0;">
          <span class="wbar" style="--h:22px;animation-delay:0s"></span>
          <span class="wbar" style="--h:12px;animation-delay:.1s"></span>
          <span class="wbar" style="--h:18px;animation-delay:.2s"></span>
          <span class="wbar" style="--h:8px; animation-delay:.3s"></span>
          <span class="wbar" style="--h:20px;animation-delay:.4s"></span>
          <span class="wbar" style="--h:10px;animation-delay:.5s"></span>
          <span class="wbar" style="--h:16px;animation-delay:.6s"></span>
        </div>
      </div>
    </div>

    <!-- Scrollable content -->
    <div class="scroll-area"
      style="flex:1;overflow-y:auto;padding:1.25rem;display:flex;flex-direction:column;gap:1rem;min-height:0;">

      <!-- Drop Zone -->
      <div id="drop-zone" class="drop-shell" style="cursor:pointer;">
        <div class="drop-inner" style="display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1rem;padding:2.5rem 1.5rem;">
          <div id="drop-icon"
            style="width:4rem;height:4rem;border-radius:1rem;background:rgba(0,150,199,.15);border:1px solid rgba(0,180,216,.3);display:flex;align-items:center;justify-content:center;font-size:2rem;">
            🎵
          </div>
          <div style="text-align:center;">
            <p id="drop-title" style="font-size:clamp(1rem,4vw,1.25rem);font-weight:600;color:#fff;margin-bottom:0.25rem;">
              Tap to pick an MP3
            </p>
            <p id="drop-sub" style="font-size:clamp(0.75rem,3vw,0.875rem);color:#64748b;">
              AI transcribes &amp; syncs lyrics in seconds
            </p>
          </div>
        </div>
      </div>

      <!-- Analysis Progress Panel -->
      <div id="analysis-panel" class="glass" style="display:none;border-radius:1rem;padding:1rem;">
        <div style="display:flex;align-items:center;gap:1rem;">
          <svg style="width:3.5rem;height:3.5rem;flex-shrink:0;" viewBox="0 0 64 64" class="ring-svg">
            <circle class="ring-track" cx="32" cy="32" r="26" fill="none" stroke-width="4" />
            <circle id="ring-fill" class="ring-fill" cx="32" cy="32" r="26" fill="none" stroke="url(#rg)"
              stroke-width="4" stroke-dasharray="163.4" stroke-dashoffset="163.4" />
            <defs>
              <linearGradient id="rg" x1="0%" y1="0%" x2="100%" y2="0%">
                <stop offset="0%"   stop-color="#0096c7" />
                <stop offset="100%" stop-color="#00e5ff" />
              </linearGradient>
            </defs>
          </svg>
          <div style="flex:1;min-width:0;">
            <p id="analysis-step"
              style="font-size:0.875rem;color:#cbd5e1;font-weight:500;margin-bottom:0.5rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">
              Initializing…
            </p>
            <div style="height:6px;background:rgba(255,255,255,.06);border-radius:3px;overflow:hidden;">
              <div id="analysis-bar"
                style="height:100%;width:0%;background:linear-gradient(to right,#0096c7,#00e5ff);border-radius:3px;transition:width .5s ease;">
              </div>
            </div>
            <p id="analysis-pct" style="font-size:0.75rem;color:#64748b;margin-top:0.25rem;">0%</p>
          </div>
        </div>
      </div>

      <!-- Lyrics Panel -->
      <div class="glass" style="border-radius:1rem;display:flex;flex-direction:column;flex:1;min-height:12rem;">

        <!-- Lyrics header -->
        <div style="display:flex;align-items:center;justify-content:space-between;padding:0.875rem 1rem 0.75rem;border-bottom:1px solid rgba(255,255,255,.05);">
          <h3 style="font-size:0.6875rem;font-weight:600;text-transform:uppercase;letter-spacing:.1em;color:#64748b;">
            Lyrics
          </h3>
          <span id="lang-badge"
            style="display:none;font-size:0.6875rem;padding:0.125rem 0.5rem;border-radius:9999px;background:rgba(0,100,160,.4);border:1px solid rgba(0,180,216,.3);color:#7dd3fc;">
          </span>
        </div>

        <!-- ── Translation bar (hidden until lyrics are visible) ─────────── -->
        <div id="translate-bar" class="translate-bar" aria-hidden="true">
          <span class="translate-bar__label">🌐 Translate to</span>
          <select id="translate-lang" class="translate-bar__select">
            <option value="">— Choose language —</option>
            <option value="en">🇬🇧 English</option>
            <option value="fr">🇫🇷 French</option>
            <option value="es">🇪🇸 Spanish</option>
            <option value="de">🇩🇪 German</option>
            <option value="it">🇮🇹 Italian</option>
            <option value="pt">🇧🇷 Portuguese</option>
            <option value="ru">🇷🇺 Russian</option>
            <option value="ar">🇸🇦 Arabic</option>
            <option value="zh">🇨🇳 Chinese (Simplified)</option>
            <option value="ja">🇯🇵 Japanese</option>
            <option value="ko">🇰🇷 Korean</option>
            <option value="hi">🇮🇳 Hindi</option>
            <option value="nl">🇳🇱 Dutch</option>
            <option value="pl">🇵🇱 Polish</option>
            <option value="sv">🇸🇪 Swedish</option>
            <option value="tr">🇹🇷 Turkish</option>
          </select>
          <button id="btn-translate" class="translate-bar__btn">Translate</button>
        </div>

        <!-- Lyrics content -->
        <div id="lyrics-display"
          style="flex:1;overflow-y:auto;padding:0.75rem 1rem;display:flex;flex-direction:column;gap:0.25rem;">
          <p style="color:#475569;font-style:italic;font-size:0.875rem;">Drop an MP3 to begin…</p>
        </div>
      </div>

    </div><!-- /scroll-area -->

    <!-- ── Player Bar ──────────────────────────────────────────────────────── -->
    <div id="player-bar" class="glass"
      style="display:none;border-top:1px solid rgba(255,255,255,.05);padding:0.75rem 1rem;flex-shrink:0;">

      <!-- Row 1: Big play button centred -->
      <div style="display:flex;justify-content:center;margin-bottom:0.625rem;">
        <button id="btn-play"
          style="width:3.5rem;height:3.5rem;border-radius:50%;background:linear-gradient(135deg,#0096c7,#00b4d8);border:none;color:#fff;font-size:1.375rem;display:flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:0 4px 20px rgba(0,180,216,.45);transition:transform .15s,background .2s;flex-shrink:0;"
          aria-label="Play / Pause">
          ▶
        </button>
      </div>

      <!-- Row 2: Seek bar + time -->
      <div class="player-row"
        style="display:flex;align-items:center;gap:0.5rem;width:100%;max-width:100%;">
        <span id="time-cur" class="time-label"
          style="font-size:0.6875rem;color:#64748b;font-family:monospace;flex-shrink:0;width:2.25rem;">0:00</span>

        <input id="seek-bar" type="range" min="0" max="100" value="0"
          style="flex:1 1 0;min-width:0;max-width:100%;accent-color:#00b4d8;" />

        <span id="time-dur" class="time-label"
          style="font-size:0.6875rem;color:#64748b;font-family:monospace;flex-shrink:0;width:2.25rem;text-align:right;">0:00</span>
      </div>
    </div>

  </main>

  <audio id="player"></audio>

  <!-- Sidebar toggle -->
  <script>
    (function () {
      var btn  = document.getElementById('btn-library-toggle');
      var body = document.getElementById('sidebar-body');

      // On mobile, hide the body initially
      if (window.innerWidth <= 768) {
        body.style.display = 'none';
      }

      btn.addEventListener('click', function () {
        var isOpen = body.style.display !== 'none';
        body.style.display = isOpen ? 'none' : 'flex';
        body.style.flexDirection = 'column';
        btn.setAttribute('aria-expanded', String(!isOpen));
      });

      // Re-evaluate on resize
      window.addEventListener('resize', function () {
        if (window.innerWidth > 768) {
          body.style.display = 'flex';
          body.style.flexDirection = 'column';
        } else if (btn.getAttribute('aria-expanded') !== 'true') {
          body.style.display = 'none';
        }
      });
    })();
  </script>

  <!-- App logic -->
  <script src="app.js" defer></script>
</body>

</html>
